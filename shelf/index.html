<script>
if(new URLSearchParams(location.search).get('repair')==='1'){
  window.__mangaRepairMode=true;
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.innerHTML='<main style="max-width:560px;margin:0 auto;padding:28px 18px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#f5f5f7;min-height:100vh"><h1 style="font-size:22px">漫画本棚の修復</h1><p>本棚が繰り返し再読み込みされる場合の修復ページです。</p><p style="color:#ffcf70">この操作で漫画本棚に保存された漫画データと、漫画リーダー専用のキャッシュを削除します。GitHub上のアプリ本体は削除しません。</p><button id="repairStart" style="width:100%;padding:15px;border:0;border-radius:10px;background:#e7b85c;color:#111;font-size:16px;font-weight:bold">専用データを削除して修復</button><p id="repairStatus" style="white-space:pre-wrap"></p><p><a id="openShelf" href="./" style="color:#8ecbff;display:none">修復後に漫画本棚を開く</a></p></main>';
    document.getElementById('repairStart').addEventListener('click',async()=>{
      const b=document.getElementById('repairStart'),st=document.getElementById('repairStatus');
      b.disabled=true;st.textContent='修復中です。画面を閉じずにお待ちください…';
      const notes=[];
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          for(const reg of regs){if(reg.scope.includes('/manga-reader/shelf/')){await reg.unregister();notes.push('サービスワーカーを解除しました');}}
        }
      }catch(e){notes.push('サービスワーカー解除: '+e.message);}
      try{
        if('caches' in window){for(const key of await caches.keys()){if(key.startsWith('manga-shelf-shell-')){await caches.delete(key);notes.push('専用キャッシュを削除しました');}}}
      }catch(e){notes.push('キャッシュ削除: '+e.message);}
      try{
        await new Promise((resolve,reject)=>{
          const req=indexedDB.deleteDatabase('manga-shelf-db-v1');
          req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error||new Error('削除できませんでした'));req.onblocked=()=>{st.textContent='データベースが使用中です。Safariで開いている漫画本棚のタブを閉じてから、このページを開き直してください。';};
        });
        notes.push('保存データベースを削除しました');
      }catch(e){notes.push('データベース削除: '+e.message);}
      st.textContent=notes.join('\n')+'\n\n修復処理が終了しました。';
      document.getElementById('openShelf').style.display='inline-block';
      b.textContent='修復処理済み';
    });
  });
}
</script>

<script type="module">

<script>
(()=> {
if(window.__mangaRepairMode)return;
'use strict';
const $=id=>document.getElementById(id);
const DB_NAME='manga-shelf-db-v1', STORE='books';
let db, dbReady=null, books=[], activeBook=null, page=0, pages=[], zoom=1, pdfDoc=null, pdfObjectUrl=null, activeTab='shelf', toastTimer, selectionMode=false, pageObserver=null, lastReaderScrollAt=0, scrollLoadQueue=[], scrollLoadsActive=0;
const selectedBookIds=new Set();
 let shelfSort=localStorage.getItem('manga-shelf-sort')||'added';
 let shelfQuery='',favoritesOnly=false;
 function sortBooks(list){const a=list.slice();if(shelfSort==='nameAsc')return a.sort((x,y)=>natural(x.name||'',y.name||''));if(shelfSort==='nameDesc')return a.sort((x,y)=>natural(y.name||'',x.name||''));if(shelfSort==='lastRead')return a.sort((x,y)=>(y.lastRead||0)-(x.lastRead||0)||(y.added||0)-(x.added||0));return a.sort((x,y)=>(y.added||0)-(x.added||0))}
 function updateSortLabel(){const el=$('shelfSort');if(el)el.value=shelfSort}
 function normalizeShelfSearch(value){return String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s\u3000]+/g,'').replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[×✕＊*]/g,'x') }
function shelfSearchText(book){const name=normalizeShelfSearch(book.name);const aliases=[];if(name.includes('3x3eyes')||name.includes('サザンアイズ')||name.includes('さんさんあいず'))aliases.push('サザンアイズ','さんさんあいず','3x3eyes');return [name,...aliases.map(normalizeShelfSearch)].join(' ')}
function renderMainShelf(){const q=normalizeShelfSearch(shelfQuery);const shown=books.filter(b=>(!q||shelfSearchText(b).includes(q))&&(!favoritesOnly||b.favorite));renderShelf($('shelf'),shown);$('noSearchResults').classList.toggle('hidden',books.length===0||shown.length>0);$('favoritesOnly').textContent=favoritesOnly?'★ お気に入りのみ':'☆ お気に入り';$('favoritesOnly').setAttribute('aria-pressed',String(favoritesOnly))}
const state={direction:'rtl',layout:'single'};
let openBookGeneration=0;
function isSmallScreen(){return window.matchMedia('(max-width: 600px)').matches}
function pageStep(){return state.layout==='spread'?2:1}
function setFullscreen(on){$('reader').classList.toggle('fullscreen',!!on);$('fullscreenToggle').textContent=on?'全画面を終了':'全画面';requestAnimationFrame(()=>requestAnimationFrame(updateScrollPageHeights));}
 function updateScrollPageHeights(){const body=$('readerBody');if(!body||state.layout!=='scroll'||!body.classList.contains('scrollmode'))return;const h=Math.max(200,body.clientHeight-16);body.querySelectorAll('.pageimg,canvas').forEach(el=>{el.style.maxHeight=h+'px';el.style.maxWidth='100%';el.style.width='auto';el.style.height='auto'});}
 window.addEventListener('resize',()=>requestAnimationFrame(updateScrollPageHeights),{passive:true});window.addEventListener('orientationchange',()=>setTimeout(updateScrollPageHeights,150));if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>requestAnimationFrame(updateScrollPageHeights),{passive:true});
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),10000)}
function openDB(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>{const conn=req.result;db=conn;conn.onversionchange=()=>{conn.close();if(db===conn)db=null;dbReady=null};conn.onclose=()=>{if(db===conn)db=null;dbReady=null};resolve(conn)};req.onerror=()=>reject(req.error||new Error('IndexedDBを開けません'));req.onblocked=()=>reject(new Error('データベースが別のタブで使用中です'))}catch(e){reject(e)}})}
function ensureDB(){if(db&&!db.readyState) return Promise.resolve(db);if(dbReady)return dbReady;dbReady=openDB().catch(e=>{db=null;dbReady=null;throw e});return dbReady}
async function runDBRequest(makeRequest){for(let attempt=0;attempt<2;attempt++){try{const conn=await ensureDB();return await new Promise((resolve,reject)=>{let req;try{req=makeRequest(conn)}catch(e){reject(e);return}req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB処理に失敗しました'));})}catch(e){const msg=String(e&&e.message||e);if(attempt===0&&(/transaction|closing|closed|internal error|Indexed Database server|InvalidStateError/i.test(msg))){try{if(db)db.close()}catch(_){}db=null;dbReady=null;continue}throw e}}throw new Error('端末内データベースを再接続できませんでした')}
async function dbAll(){return (await runDBRequest(conn=>conn.transaction(STORE).objectStore(STORE).getAll()))||[]}
async function dbPut(book){await runDBRequest(conn=>conn.transaction(STORE,'readwrite').objectStore(STORE).put(book))}
async function dbDelete(id){await runDBRequest(conn=>conn.transaction(STORE,'readwrite').objectStore(STORE).delete(id))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function isImage(f){return f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(f.name)}
function isArchive(f){return /\.(zip|cbz)$/i.test(f.name)}
function isPdf(f){return /\.pdf$/i.test(f.name)||f.type==='application/pdf'}
function natural(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})}
function safeName(s){return (s||'無題').replace(/\.[^.]+$/,'')}
function makeBook(name,type,items){return {id:uid(),name,type,items,coverIndex:0,page:0,direction:'rtl',layout:'single',bookmarks:[],lastRead:0,added:Date.now(),total:items.length,progress:0}}
function itemBlob(it){if(it.bytes)return new Blob([it.bytes],{type:it.type||mime(it.name)});return it.blob||null}
async function filesToBooks(fileList){
 const fs=Array.from(fileList||[]);if(!fs.length)return [];
 const out=[], imageFiles=fs.filter(isImage), archives=fs.filter(isArchive), pdfs=fs.filter(isPdf), unsupported=fs.filter(f=>!isImage(f)&&!isArchive(f)&&!isPdf(f));
 // iOS Safari can lose access to File-backed Blobs stored in IndexedDB (NotFoundError).
 // Store folder-selected image files as ArrayBuffers; create a Blob only for the page being rendered.
 async function storedImageBytes(f){return await f.arrayBuffer()}
 function storedBlob(f){return f.slice(0,f.size,fileType(f))}
 function fileType(f){return f.type||(/\.pdf$/i.test(f.name)?'application/pdf':(/\.(jpe?g)$/i.test(f.name)?'image/jpeg':(/\.png$/i.test(f.name)?'image/png':(/\.webp$/i.test(f.name)?'image/webp':'application/octet-stream'))))}
 const folderMode=fs.some(f=>f.webkitRelativePath);
 if(folderMode){
   const groups=new Map();
   imageFiles.forEach(f=>{const path=f.webkitRelativePath||f.name;const parts=path.split('/');const group=parts.length>2?parts.slice(0,-1).join('/'):parts[0]||'画像';if(!groups.has(group))groups.set(group,[]);groups.get(group).push(f)});
   for(const [name,arr] of groups){arr.sort((a,b)=>natural(a.name,b.name));const items=[];for(const f of arr)items.push({name:f.name,bytes:await storedImageBytes(f),type:fileType(f)});out.push(makeBook(name.split('/').pop(),'images',items));}
 } else if(imageFiles.length){
