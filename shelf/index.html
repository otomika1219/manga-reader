*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{touch-action:manipulation;border:0;border-radius:12px;background:var(--panel2);color:var(--text);padding:11px 14px;cursor:pointer}button.primary{background:var(--accent);color:#171717;font-weight:700}button:disabled{opacity:.4}header{position:sticky;top:0;z-index:5;background:#151515f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:20px;margin:0}header small{color:var(--muted)}main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar button{flex:1;min-width:100px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.sectionhead h2{font-size:17px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.book{min-width:0;position:relative;cursor:pointer}.selectMark{display:none;position:absolute;top:7px;right:7px;width:27px;height:27px;border-radius:50%;background:#222d;color:#fff;border:2px solid #fff;align-items:center;justify-content:center;font-weight:800;box-shadow:0 1px 5px #0008}.selectMark.visible{display:flex}.selectMark.checked{background:var(--accent);color:#111;border-color:var(--accent)}.cover{width:100%;aspect-ratio:3/4.2;background:linear-gradient(135deg,#373737,#202020);border-radius:8px;overflow:hidden;border:1px solid #414141;box-shadow:0 5px 12px #0008;display:flex;align-items:center;justify-content:center;color:#ddd;text-align:center}.cover img{width:100%;height:100%;object-fit:cover}.cover .placeholder{padding:8px;font-weight:700;overflow-wrap:anywhere}.bookname{font-size:13px;margin-top:8px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bookmeta{font-size:11px;color:var(--muted);margin-top:4px}.progress{height:3px;background:#444;margin-top:7px;border-radius:4px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.empty{padding:34px 18px;text-align:center;color:var(--muted);background:var(--panel);border-radius:18px;line-height:1.7}.empty strong{color:var(--text);display:block;font-size:17px;margin-bottom:6px}.hidden{display:none!important}.filepicker{position:fixed!important;left:8px!important;top:8px!important;width:2px!important;height:2px!important;opacity:.01!important;z-index:100!important;overflow:hidden!important;pointer-events:auto!important}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0}.status{padding:10px 12px;background:#29251a;border:1px solid #5b4a25;color:#f0dba8;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:12px}.bottomnav{position:fixed;z-index:7;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#171717f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:6px}.bottomnav button{background:transparent;flex:1;font-size:12px;padding:8px 4px}.bottomnav button.active{color:var(--accent)}.reader{position:fixed;inset:0;z-index:20;background:var(--reader-bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.reader.fullscreen{padding-top:0}.reader.fullscreen .readerhead,.reader.fullscreen .readerfoot{display:none}.reader.fullscreen .readerbody{height:100%;flex:1}.fullscreenExit{display:none;position:absolute;z-index:25;top:calc(env(safe-area-inset-top) + 8px);right:8px;background:#222c;color:#fff;padding:8px 11px;border:1px solid #7778;border-radius:18px}.reader.fullscreen .fullscreenExit{display:block}.readerhead,.readerfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#171717;flex-shrink:0}.readerhead .booktitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.readerhead button,.readerfoot button{padding:9px 11px;touch-action:manipulation;user-select:none;-webkit-user-select:none}.readerbody{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.readerbody.scrollmode{display:block;text-align:center}.pageimg{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.spread{display:flex;align-items:center;justify-content:center;width:100%;height:100%;gap:1px}.spread img{width:50%;height:100%;max-height:100%;object-fit:contain}.spread canvas{width:50%;height:100%;object-fit:contain}.readerbody.scrollmode{display:block;width:100%;max-width:100vw;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}.readerbody.scrollmode .pageimg,.readerbody.scrollmode canvas{display:block;width:auto;max-width:100%;height:auto;max-height:100%;margin:0 auto 3px}.readerfoot{flex-wrap:wrap;justify-content:center}.readerfoot .counter{min-width:78px;text-align:center;font-size:12px;color:#ddd}.readerfoot input[type=range]{width:100%;accent-color:var(--accent)}.readeropts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.readeropts select{background:var(--panel2);color:var(--text);border:0;border-radius:10px;padding:8px;max-width:45%}.modalback{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;justify-content:center}.modal{background:#202022;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:650px;max-height:85vh;overflow:auto}.modal h2{margin:0 0 14px;font-size:19px}.modalrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modalrow button{flex:1}.field{display:block;margin:12px 0;font-size:13px;color:var(--muted)}.field input,.field select{display:block;margin-top:6px;width:100%;background:#111;color:white;border:1px solid #444;border-radius:10px;padding:11px}.bookmarkrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}.toast{position:fixed;z-index:40;bottom:90px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:10px 15px;border-radius:20px;max-width:90%;font-size:13px;box-shadow:0 4px 20px #0008}.reader .readerbody canvas{max-width:100%;max-height:100%;object-fit:contain}.readerbody.scrollmode canvas{display:block;width:auto;max-width:100%;height:auto;margin:0 auto 3px}
@media(min-width:650px){.shelf{grid-template-columns:repeat(5,minmax(0,1fr))}main{padding-left:24px;padding-right:24px}.cover{aspect-ratio:3/4}}

<body>
<header><div><h1>📚 漫画本棚</h1><small id="bookcount">端末内に保存</small></div><button id="settingsBtn">設定</button></header>
<main id="home">
<div id="offlineStatus" class="status">端末内保存を基本にしています。初回はインターネット接続中にこのページを開いてください。追加した漫画はこのブラウザ内に保存されます。</div>
<div class="toolbar"><button class="primary" id="addFiles">＋ 漫画を追加</button><button id="continueBtn">▶ 続きから読む</button><button id="selectBooksBtn">選択・一括削除</button></div>
<input id="fileInput" type="file" multiple accept="image/*,.zip,.cbz,.pdf" class="filepicker">
<input id="folderInput" type="file" multiple webkitdirectory accept="image/*,.zip,.cbz,.pdf" class="filepicker">

<section id="continueSection" class="hidden"><div class="sectionhead"><h2>続きを読む</h2><span>前回の続き</span></div><div id="continueShelf" class="shelf"></div></section>
<section><div class="sectionhead"><h2>本棚</h2><select id="shelfSort" aria-label="本棚の並び順" style="max-width:58%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12px"><option value="added">追加した順（新しい順）</option><option value="nameAsc">タイトル順（あいうえお）</option><option value="nameDesc">タイトル順（逆）</option><option value="lastRead">最近読んだ順</option></select></div><div style="display:flex;gap:8px;margin:0 0 12px;align-items:center"><input id="shelfSearch" type="search" placeholder="🔍 漫画タイトルを検索" aria-label="漫画タイトルを検索" style="flex:1;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px"><button id="favoritesOnly" type="button" aria-pressed="false" style="white-space:nowrap">☆ お気に入り</button></div><div id="noSearchResults" class="empty hidden" style="margin-bottom:12px">該当する漫画がありません。</div><div id="bulkBar" class="toolbar hidden"><span id="selectedCount" style="align-self:center;font-size:13px;color:var(--muted)">0冊選択中</span><button id="selectAllBooks">すべて選択</button><button class="primary" id="deleteSelectedBooks">選択した漫画を削除</button><button id="cancelSelectBooks">キャンセル</button></div><div id="shelf" class="shelf"></div><div id="empty" class="empty"><strong>本棚はまだ空です</strong>「漫画を追加」から画像・ZIP/CBZ・PDFを選んでください。<br>選んだデータはこの端末のブラウザ内に保存します。</div></section>
<section id="historySection" class="hidden"><div class="sectionhead"><h2>読書履歴</h2><span>最近読んだ順</span></div><div id="historyShelf" class="shelf"></div></section>
</main>
<nav class="bottomnav"><button class="active" data-tab="shelf">▦ 本棚</button><button data-tab="history">◷ 履歴</button><button data-tab="bookmarks">🔖 しおり</button></nav>
<div id="reader" class="reader hidden">
<div class="readerhead"><button id="closeReader">‹ 本棚</button><div class="booktitle" id="readerTitle"></div><button id="bookmarkBtn">🔖</button></div>
<button id="fullscreenExit" class="fullscreenExit" aria-label="全画面を終了">全画面を終了 ✕</button><div id="readerBody" class="readerbody"></div>
<div class="readerfoot"><button id="prevPage">‹ 前へ</button><span class="counter" id="pageCounter">0 / 0</span><button id="nextPage">次へ ›</button><input id="pageSlider" type="range" min="0" max="0" value="0" aria-label="ページ移動"><div class="readeropts"><select id="direction"><option value="rtl">右開き</option><option value="ltr">左開き</option></select><select id="layout"><option value="single">1ページ</option><option value="spread">見開き</option><option value="scroll">縦スクロール</option></select><button id="zoomOut">－</button><button id="zoomIn">＋</button><button id="readerMenu">その他</button><button id="fullscreenToggle">全画面</button></div></div>
</div>
<div id="modalBack" class="modalback hidden"><div class="modal" id="modal"></div></div><div id="toast" class="toast hidden"></div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
window.__pdfjs=pdfjsLib;
</script>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
const DB_NAME='manga-shelf-db-v1', STORE='books';
let db, dbReady=null, books=[], activeBook=null, page=0, pages=[], zoom=1, pdfDoc=null, pdfSourceUrl=null, activeTab='shelf', toastTimer, selectionMode=false, pageObserver=null, lastReaderScrollAt=0, scrollLoadQueue=[], scrollLoadsActive=0;
const selectedBookIds=new Set();
 let shelfSort=localStorage.getItem('manga-shelf-sort')||'added';
 let shelfQuery='',favoritesOnly=false;
 function sortBooks(list){const a=list.slice();if(shelfSort==='nameAsc')return a.sort((x,y)=>natural(x.name||'',y.name||''));if(shelfSort==='nameDesc')return a.sort((x,y)=>natural(y.name||'',x.name||''));if(shelfSort==='lastRead')return a.sort((x,y)=>(y.lastRead||0)-(x.lastRead||0)||(y.added||0)-(x.added||0));return a.sort((x,y)=>(y.added||0)-(x.added||0))}
 function updateSortLabel(){const el=$('shelfSort');if(el)el.value=shelfSort}
 function normalizeShelfSearch(value){return String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s\u3000]+/g,'').replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[×✕＊*]/g,'x') }
function shelfSearchText(book){const name=normalizeShelfSearch(book.name);const aliases=[];if(name.includes('3x3eyes')||name.includes('サザンアイズ')||name.includes('さんさんあいず'))aliases.push('サザンアイズ','さんさんあいず','3x3eyes');return [name,...aliases.map(normalizeShelfSearch)].join(' ')}
function renderMainShelf(){const q=normalizeShelfSearch(shelfQuery);const shown=books.filter(b=>(!q||shelfSearchText(b).includes(q))&&(!favoritesOnly||b.favorite));renderShelf($('shelf'),shown);$('noSearchResults').classList.toggle('hidden',books.length===0||shown.length>0);$('favoritesOnly').textContent=favoritesOnly?'★ お気に入りのみ':'☆ お気に入り';$('favoritesOnly').setAttribute('aria-pressed',String(favoritesOnly))}
const state={direction:'rtl',layout:'single'};
function isSmallScreen(){return window.matchMedia('(max-width: 600px)').matches}
function pageStep(){return state.layout==='spread'?2:1}
function setFullscreen(on){$('reader').classList.toggle('fullscreen',!!on);$('fullscreenToggle').textContent=on?'全画面を終了':'全画面';requestAnimationFrame(()=>requestAnimationFrame(updateScrollPageHeights));}
 function updateScrollPageHeights(){const body=$('readerBody');if(!body||state.layout!=='scroll'||!body.classList.contains('scrollmode'))return;const h=Math.max(200,body.clientHeight-16);body.querySelectorAll('.pageimg,canvas').forEach(el=>{el.style.maxHeight=h+'px';el.style.maxWidth='100%';el.style.width='auto';el.style.height='auto'});}
 window.addEventListener('resize',()=>requestAnimationFrame(updateScrollPageHeights),{passive:true});window.addEventListener('orientationchange',()=>setTimeout(updateScrollPageHeights,150));if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>requestAnimationFrame(updateScrollPageHeights),{passive:true});
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function openDB(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};req.onerror=()=>reject(req.error||new Error('IndexedDBを開けません'));req.onblocked=()=>reject(new Error('データベースが別のタブで使用中です'))}catch(e){reject(e)}})}
function ensureDB(){if(db)return Promise.resolve(db);if(!dbReady)dbReady=openDB().catch(e=>{dbReady=null;throw e});return dbReady}
async function dbAll(){await ensureDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>{const rows=r.result||[];for(const b of rows){if(b.type==='pdf'){try{const m=localStorage.getItem('manga-pdf-meta-'+b.id);if(m)Object.assign(b,JSON.parse(m))}catch(e){}}}resolve(rows)};r.onerror=()=>reject(r.error)})}
async function dbPut(book){await ensureDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(book);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function saveBookState(book){if(!book)return;if(book.type==='pdf'){try{const meta={page:book.page,lastRead:book.lastRead,direction:book.direction,layout:book.layout,total:book.total,progress:book.progress,bookmarks:book.bookmarks,name:book.name,favorite:book.favorite};localStorage.setItem('manga-pdf-meta-'+book.id,JSON.stringify(meta))}catch(e){console.warn('PDFの読書情報を保存できません:',e)}return Promise.resolve()}return dbPut(book)}
async function dbDelete(id){await ensureDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function isImage(f){return f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(f.name)}
function isArchive(f){return /\.(zip|cbz)$/i.test(f.name)}
function isPdf(f){return /\.pdf$/i.test(f.name)||f.type==='application/pdf'}
function natural(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})}
function safeName(s){return (s||'無題').replace(/\.[^.]+$/,'')}
function makeBook(name,type,items){return {id:uid(),name,type,items,coverIndex:0,page:0,direction:'rtl',layout:'single',bookmarks:[],lastRead:0,added:Date.now(),total:items.length,progress:0}}
function itemBlob(it){if(it.bytes)return new Blob([it.bytes],{type:it.type||mime(it.name)});return it.blob||null}
async function filesToBooks(fileList){
 const fs=Array.from(fileList||[]);if(!fs.length)return [];
 const out=[], imageFiles=fs.filter(isImage), archives=fs.filter(isArchive), pdfs=fs.filter(isPdf), unsupported=fs.filter(f=>!isImage(f)&&!isArchive(f)&&!isPdf(f));
 // Keep file content as Blob data. Avoid expanding the entire PDF into an ArrayBuffer during import.
 function fileType(f){return f.type||(/\.pdf$/i.test(f.name)?'application/pdf':(/\.(jpe?g)$/i.test(f.name)?'image/jpeg':(/\.png$/i.test(f.name)?'image/png':(/\.webp$/i.test(f.name)?'image/webp':'application/octet-stream'))))}
 function storedBlob(f){return new Blob([f],{type:fileType(f)})}
 const folderMode=fs.some(f=>f.webkitRelativePath);
 if(folderMode){
   const groups=new Map();
   imageFiles.forEach(f=>{const path=f.webkitRelativePath||f.name;const parts=path.split('/');const group=parts.length>2?parts.slice(0,-1).join('/'):parts[0]||'画像';if(!groups.has(group))groups.set(group,[]);groups.get(group).push(f)});
   for(const [name,arr] of groups){arr.sort((a,b)=>natural(a.name,b.name));const items=[];for(const f of arr)items.push({name:f.name,blob:storedBlob(f),type:fileType(f)});out.push(makeBook(name.split('/').pop(),'images',items));}
 } else if(imageFiles.length){
   imageFiles.sort((a,b)=>natural(a.name,b.name));const items=[];for(const f of imageFiles)items.push({name:f.name,blob:storedBlob(f),type:fileType(f)});out.push(makeBook(imageFiles.length===1?safeName(imageFiles[0].name):'画像まとめ','images',items));
 }
 for(const f of archives)out.push(makeBook(safeName(f.name),'archive',[{name:f.name,blob:storedBlob(f),type:fileType(f)}]));
 for(const f of pdfs)out.push(makeBook(safeName(f.name),'pdf',[{name:f.name,blob:storedBlob(f),type:fileType(f)}]));
 if(unsupported.length)notify('未対応のファイルを'+unsupported.length+'件スキップしました');
 return out;
}
function compareBlob(item){if(item.bytes)return new Blob([item.bytes],{type:item.type||mime(item.name)});return item.blob instanceof Blob?item.blob:new Blob([])}
async function sameBookContent(a,b){
 if(a.type!==b.type||a.name!==b.name)return false;
 const aa=(a.items||[]).slice().sort((x,y)=>natural(x.name,y.name)),bb=(b.items||[]).slice().sort((x,y)=>natural(x.name,y.name));
 if(aa.length!==bb.length)return false;
 const chunkSize=1024*1024;
 for(let i=0;i<aa.length;i++){
  if(aa[i].name!==bb[i].name)return false;
  const x=compareBlob(aa[i]),y=compareBlob(bb[i]);
  if(x.size!==y.size)return false;
  for(let offset=0;offset<x.size;offset+=chunkSize){
   const xb=new Uint8Array(await x.slice(offset,Math.min(offset+chunkSize,x.size)).arrayBuffer());
   const yb=new Uint8Array(await y.slice(offset,Math.min(offset+chunkSize,y.size)).arrayBuffer());
   if(xb.length!==yb.length)return false;
   for(let j=0;j<xb.length;j++)if(xb[j]!==yb[j])return false;
  }
 }
 return true;
}
async function importFiles(list){
 try{
  notify('漫画を取り込んでいます…');
  const incoming=await filesToBooks(list);
  if(!incoming.length){notify('対応ファイルが見つかりません');return}
  const existing=await dbAll();let added=0,skipped=0;
  for(const b of incoming){
   let duplicate=false;
   for(const old of existing){if(await sameBookContent(old,b)){duplicate=true;break}}
   if(duplicate){skipped++;continue}
   await dbPut(b);
   const check=await dbAll();
   if(!check.some(saved=>saved.id===b.id))throw new Error('保存後の確認で漫画が見つかりません');
   existing.push(b);added++;
  }
  await refresh();
  const visibleCount=await dbAll();
  books=sortBooks(visibleCount);
  $('bookcount').textContent=books.length+'冊 · 端末内保存';
  $('empty').classList.toggle('hidden',books.length>0);
  renderMainShelf();
  renderBulkBar();
  const reading=books.filter(b=>b.lastRead).sort((a,b)=>b.lastRead-a.lastRead);

let touchX=null,lastTapAt=0,lastTapX=0,lastTapY=0,touchStartY=0;$('readerBody').addEventListener('dblclick',e=>{if(e.target.closest('button,input,select'))return;e.preventDefault();setFullscreen(!$('reader').classList.contains('fullscreen'))});$('readerBody').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});$('readerBody').addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-(touchX===null?t.clientX:touchX),dy=t.clientY-touchStartY;touchX=null;if(Math.abs(dx)<12&&Math.abs(dy)<12){const now=Date.now();if(now-lastTapAt<450&&Math.abs(t.clientX-lastTapX)<45&&Math.abs(t.clientY-lastTapY)<45){lastTapAt=0;e.preventDefault();setFullscreen(!$('reader').classList.contains('fullscreen'));return}lastTapAt=now;lastTapX=t.clientX;lastTapY=t.clientY}if(state.layout==='scroll'||Math.abs(dx)<=55)return;const forward=state.direction==='rtl'?dx<0:dx>0;movePage(forward?pageStep():-pageStep())},{passive:false});
